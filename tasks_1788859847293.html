<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <link rel="icon" type="image/png" href="./favicon_1788859847289.png">
  <title>Daily tasks – BOT Cable</title>
  <style>
    :root {
      --ink: #10233f;
      --muted: #71809a;
      --blue: #246bfe;
      --blue-dark: #1747b5;
      --line: rgba(16, 35, 63, .12);
      --shadow: 0 14px 34px rgba(32, 68, 120, .10);
      --surface: rgba(255, 255, 255, .88);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(36, 107, 254, .11), transparent 28rem),
        linear-gradient(145deg, #f7faff 0%, #f3f6fb 55%, #edf3ff 100%);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible,
    textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(36, 107, 254, .28);
      outline-offset: 2px;
    }
    .navbar {
      position: sticky;
      top: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1280px, calc(100% - 32px));
      min-height: 68px;
      margin: 14px auto 0;
      padding: 10px 16px 10px 20px;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 18px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 16px 40px rgba(32, 68, 120, .10);
      backdrop-filter: blur(14px) saturate(160%);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
    .brand img { width: 43px; height: 43px; border-radius: 12px; object-fit: cover; }
    .brand span { display: grid; gap: 1px; }
    .brand strong { font-size: 1.12rem; }
    .brand small { color: var(--muted); font-size: .71rem; letter-spacing: .06em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 7px; }
    .nav-link, .button, .icon-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #31435e;
      background: rgba(255, 255, 255, .78);
      cursor: pointer;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .nav-link, .button { padding: .58rem .84rem; font-size: .82rem; }
    .nav-link:hover, .button:hover, .icon-button:hover {
      color: var(--blue-dark);
      background: #eef4ff;
      border-color: rgba(36, 107, 254, .25);
      transform: translateY(-1px);
    }
    .page { width: min(1280px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 60px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { color: var(--blue); font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0; font-size: clamp(1.9rem, 4vw, 2.7rem); letter-spacing: -.045em; line-height: 1.08; }
    .hero p { margin: 0; color: #667793; }
    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--blue);
      border-radius: 11px;
      padding: 11px 15px;
      color: white;
      background: linear-gradient(135deg, #3177ff, #2059dd);
      box-shadow: 0 8px 18px rgba(36, 107, 254, .20);
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }
    .primary:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .daybar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 13px 15px;
      border: 1px solid rgba(16, 35, 63, .08);
      border-radius: 15px;
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 8px 22px rgba(32, 68, 120, .06);
    }
    .day-controls { display: flex; align-items: center; gap: 8px; }
    .day-controls input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
    .day-label { min-width: 142px; font-weight: 750; }
    .day-subtitle { display: block; margin-top: 2px; color: var(--muted); font-size: .74rem; font-weight: 400; }
    .summary { display: flex; align-items: center; gap: 18px; color: #667793; font-size: .8rem; }
    .summary strong { color: var(--ink); }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(245px, 1fr));
      align-items: start;
      gap: 14px;
      overflow-x: auto;
      padding: 2px 2px 14px;
    }
    .column {
      min-height: 260px;
      padding: 11px;
      border: 1px solid rgba(16, 35, 63, .08);
      border-radius: 16px;
      background: rgba(235, 241, 250, .72);
      transition: background .16s ease, border-color .16s ease;
    }
    .column.drag-over { border-color: rgba(36, 107, 254, .48); background: #e6efff; }
    .column-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 11px; }
    .column-title { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 800; }
    .column-title::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--column-color); }
    .column[data-status="todo"] { --column-color: #6380a8; }
    .column[data-status="progress"] { --column-color: #246bfe; }
    .column[data-status="waiting"] { --column-color: #df9b27; }
    .column[data-status="done"] { --column-color: #26966e; }
    .column-count { display: grid; place-items: center; min-width: 23px; height: 23px; border-radius: 8px; color: #61728c; background: rgba(255,255,255,.8); font-size: .72rem; font-weight: 700; }
    .task-list { display: grid; gap: 9px; min-height: 195px; }
    .task-card {
      padding: 13px;
      border: 1px solid rgba(16, 35, 63, .09);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 5px 15px rgba(32, 68, 120, .06);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .task-card:hover { transform: translateY(-1px); box-shadow: 0 9px 18px rgba(32, 68, 120, .10); }
    .task-card:active { cursor: grabbing; }
    .task-card.dragging { opacity: .42; transform: rotate(1deg); }
    .task-card.overdue { border-left: 3px solid #dc4b4b; }
    .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .task-title { margin: 0; color: var(--ink); font-size: .9rem; line-height: 1.4; overflow-wrap: anywhere; }
    .task-description { margin: 8px 0 0; color: #667793; font-size: .78rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 7px;
      border-radius: 99px;
      color: #31527e;
      background: #eaf1ff;
      font-size: .65rem;
      font-weight: 700;
    }
    .badge.priority-high { color: #a33c29; background: #ffebe5; }
    .badge.priority-urgent { color: #a32136; background: #ffe3e9; }
    .badge.priority-low { color: #557260; background: #e7f4eb; }
    .badge.source { color: #55657e; background: #edf0f5; }
    .task-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px; color: var(--muted); font-size: .68rem; }
    .task-controls { display: flex; align-items: center; gap: 5px; }
    .task-status {
      max-width: 104px;
      padding: 4px 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #52647e;
      background: #fff;
      font-size: .67rem;
    }
    .icon-button { padding: 4px 7px; font-size: .75rem; }
    .icon-button.danger:hover { color: #c53030; background: #fff5f5; border-color: rgba(197, 48, 48, .25); }
    .empty-column { padding: 22px 7px; color: #8b98ab; font-size: .75rem; text-align: center; }
    dialog {
      width: min(580px, calc(100% - 28px));
      padding: 0;
      border: 0;
      border-radius: 18px;
      color: var(--ink);
      background: #f8fbff;
      box-shadow: 0 24px 80px rgba(15, 35, 70, .28);
    }
    dialog::backdrop { background: rgba(16, 35, 63, .42); backdrop-filter: blur(3px); }
    .dialog-inner { padding: 22px; }
    .dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .dialog-heading h2 { margin: 3px 0 0; font-size: 1.25rem; }
    .field-group { display: grid; gap: 7px; margin-bottom: 14px; }
    .field-group label { color: #4d607c; font-size: .8rem; font-weight: 700; }
    .field, .textarea, .select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
    }
    .textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 900px) {
      .navbar { position: static; width: calc(100% - 20px); }
      .page { width: calc(100% - 24px); padding-top: 30px; }
      .board { grid-template-columns: repeat(4, minmax(260px, 1fr)); }
    }
    @media (max-width: 560px) {
      .brand small { display: none; }
      .brand img { width: 36px; height: 36px; }
      .brand strong { font-size: 1rem; }
      .nav-links { gap: 4px; }
      .nav-link { padding: 7px; font-size: .72rem; }
      .hero { display: block; }
      .hero .primary { width: 100%; margin-top: 18px; }
      .daybar { align-items: flex-start; flex-direction: column; }
      .summary { gap: 11px; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
    }
    [hidden] { display: none !important; }
    .day-controls { flex-wrap: wrap; }
    .task-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid rgba(16, 35, 63, .08);
      border-radius: 14px;
      background: rgba(255,255,255,.8);
      box-shadow: 0 8px 22px rgba(32,68,120,.05);
    }
    .task-search {
      flex: 1;
      min-width: 190px;
      max-width: 390px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
    }
    .task-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .task-filter {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #53647d;
      background: #fff;
      cursor: pointer;
      font-size: .76rem;
      font-weight: 700;
    }
    .task-filter[aria-pressed="true"] { border-color: rgba(36,107,254,.34); color: var(--blue-dark); background: #edf4ff; }
    .button[aria-pressed="true"] { border-color: rgba(36,107,254,.34); color: var(--blue-dark); background: #edf4ff; }
    .table-wrap {
      overflow: auto;
      border: 1px solid rgba(16,35,63,.09);
      border-radius: 15px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
    }
    .task-table { width: 100%; min-width: 850px; border-collapse: separate; border-spacing: 0; }
    .task-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px 13px;
      color: #65758e;
      background: #f4f7fc;
      border-bottom: 1px solid var(--line);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .task-table td { padding: 11px 13px; border-bottom: 1px solid rgba(16,35,63,.07); vertical-align: top; }
    .task-table tbody tr:last-child > td { border-bottom: 0; }
    .task-row:hover > td { background: #fbfdff; }
    .task-name { min-width: 255px; }
    .task-name details > summary {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--ink);
      cursor: pointer;
      font-size: .84rem;
      font-weight: 750;
      line-height: 1.45;
      list-style: none;
      overflow-wrap: anywhere;
    }
    .task-name details > summary::-webkit-details-marker { display: none; }
    .task-name details > summary::before { content: "›"; flex: 0 0 auto; color: #7d8ba2; font-size: 1.1rem; line-height: 1.15; transition: transform .15s ease; }
    .task-name details[open] > summary::before { transform: rotate(90deg); }
    .dollar-badge {
      display: inline-flex;
      margin: 5px 0 0 18px;
      padding: 3px 7px;
      border-radius: 20px;
      color: #a2451f;
      background: #fff0e6;
      font-size: .65rem;
      font-weight: 800;
    }
    .task-details {
      display: grid;
      gap: 8px;
      margin: 10px 0 2px 18px;
      padding: 11px;
      border-left: 2px solid #c7d8f7;
      border-radius: 0 9px 9px 0;
      color: #5e6f88;
      background: #f7f9fd;
      font-size: .75rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .detail-label { color: #344762; font-size: .68rem; font-weight: 800; }
    .copy-text-button {
      justify-self: start;
      padding: 6px 8px;
      border: 1px solid rgba(36,107,254,.2);
      border-radius: 7px;
      color: var(--blue-dark);
      background: #fff;
      cursor: pointer;
      font-size: .7rem;
      font-weight: 750;
    }
    .related-text { max-width: 220px; color: #566983; font-size: .75rem; line-height: 1.4; overflow-wrap: anywhere; }
    .source-type { display: block; margin-top: 3px; color: #8a97aa; font-size: .67rem; }
    .table-select {
      max-width: 125px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #405471;
      background: #fff;
      font-size: .72rem;
    }
    .task-priority { color: #53647d; font-size: .74rem; white-space: nowrap; }
    .task-priority.priority-urgent, .task-priority.priority-high { color: #b44537; font-weight: 750; }
    .task-priority.priority-low { color: #43805e; }
    .row-actions { display: flex; gap: 5px; white-space: nowrap; }
    .row-action {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #4e607a;
      background: #fff;
      cursor: pointer;
      font-size: .72rem;
      font-weight: 700;
    }
    .row-action:hover { color: var(--blue-dark); border-color: rgba(36,107,254,.25); background: #f1f6ff; }
    .row-action.delete:hover { color: #bd3333; border-color: rgba(189,51,51,.24); background: #fff5f5; }
    .table-empty { padding: 36px 16px !important; color: #77869d; text-align: center; }
    #board { display: none !important; }
    @media (max-width: 720px) {
      .task-toolbar { align-items: stretch; flex-direction: column; }
      .task-search { width: 100%; max-width: none; }
      .day-controls { gap: 6px; }
      .day-label { min-width: 115px; }
    }
    @media (max-width: 560px) {
      .task-filters { display: grid; grid-template-columns: repeat(3, 1fr); }
      .task-filter { padding: 8px 5px; font-size: .68rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index_1788859847291.html" class="brand" aria-label="BOT Cable home">
      <img src="./logo_1788859847289.png" alt="BOT Cable logo">
       <span><strong>BOT Cable</strong><small>Daily task list</small></span>
    </a>
    <div class="nav-links">
      <a href="index_1788859847291.html" class="nav-link">Cases</a>
      <a href="incident_1788859847292.html" class="nav-link">Incidents</a>
      <a href="dashboard_1788859847290.html" class="nav-link">Dashboard</a>
    </div>
  </nav>

  <main class="page">
    <section class="hero">
      <div>
         <div class="eyebrow">DAILY TASKS</div>
         <h1>One clear list for every follow-up.</h1>
         <p>Expand a row for the details, copy case text, and update or remove tasks without leaving the list.</p>
      </div>
      <button id="addTask" class="primary" type="button">＋ Add task</button>
    </section>

    <section class="daybar" aria-label="Choose a work day">
      <div class="day-controls">
        <button id="previousDay" class="button" type="button" aria-label="Previous day">←</button>
        <div class="day-label">
          <span id="dayLabel">Today</span>
          <span id="daySubtitle" class="day-subtitle"></span>
        </div>
        <button id="nextDay" class="button" type="button" aria-label="Next day">→</button>
        <button id="todayButton" class="button" type="button">Today</button>
         <button id="allTasksButton" class="button" type="button" aria-pressed="true">All dates</button>
        <label class="sr-only" for="dayPicker">Choose date</label>
        <input id="dayPicker" type="date">
      </div>
      <div class="summary">
        <span><strong id="dayTaskCount">0</strong> tasks</span>
        <span><strong id="dayDoneCount">0</strong> done</span>
      </div>
    </section>

     <section class="task-toolbar" aria-label="Find tasks">
       <label class="sr-only" for="taskSearch">Search tasks and case content</label>
       <input id="taskSearch" class="task-search" type="search" placeholder="Search tasks, cases, or text…">
       <div class="task-filters" role="group" aria-label="Filter task list">
         <button class="task-filter" type="button" data-filter="all" aria-pressed="true">All tasks</button>
         <button class="task-filter" type="button" data-filter="dollar" aria-pressed="false">$ cases</button>
         <button class="task-filter" type="button" data-filter="active" aria-pressed="false">Open tasks</button>
       </div>
     </section>
     <div class="table-wrap">
       <table class="task-table" aria-label="Tasks and linked cases">
         <thead><tr><th scope="col">Task / details</th><th scope="col">Related record</th><th scope="col">Status</th><th scope="col">Due</th><th scope="col">Priority</th><th scope="col">Actions</th></tr></thead>
         <tbody id="taskTableBody"></tbody>
       </table>
     </div>
     <section id="board" class="board" aria-label="Task board"></section>
  </main>

  <dialog id="taskDialog" aria-labelledby="dialogTitle">
    <form id="taskForm" class="dialog-inner">
      <div class="dialog-heading">
        <div>
          <div class="eyebrow">TASK DETAILS</div>
          <h2 id="dialogTitle">Add task</h2>
        </div>
        <button id="closeDialog" class="icon-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <div class="field-group">
        <label for="taskTitle">Task title</label>
        <input id="taskTitle" class="field" type="text" maxlength="120" placeholder="For example: Call customer with update" required>
      </div>
      <div class="field-group">
        <label for="taskDescription">Details</label>
        <textarea id="taskDescription" class="textarea" maxlength="2000" placeholder="Add a reminder, next step, or useful context…"></textarea>
      </div>
      <div class="form-grid">
        <div class="field-group">
          <label for="taskSource">Related case or incident</label>
          <select id="taskSource" class="select">
            <option value="">No linked case or incident</option>
          </select>
        </div>
        <div class="field-group">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority" class="select">
            <option value="Normal">Normal</option>
            <option value="Low">Low</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="field-group">
          <label for="taskDate">Work day</label>
          <input id="taskDate" class="field" type="date" required>
        </div>
        <div class="field-group">
          <label for="taskStatus">Status</label>
          <select id="taskStatus" class="select">
            <option value="todo">To do</option>
            <option value="progress">In progress</option>
            <option value="waiting">Waiting</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="cancelDialog" class="button" type="button">Cancel</button>
        <button class="primary" type="submit">Save task</button>
      </div>
    </form>
  </dialog>

  <script type="text/plain" id="legacyTaskBoardScript">
    (() => {
      "use strict";
      const TASKS_KEY = "daily_tasks_v1";
      const DISMISSED_DOLLAR_TASKS_KEY = "dismissed_dollar_tasks_v1";
      const CASES_KEY = "notes_v1";
      const INCIDENTS_KEY = "incidents_v1";
      const columns = [
        { id: "todo", label: "To do" },
        { id: "progress", label: "In progress" },
        { id: "waiting", label: "Waiting" },
        { id: "done", label: "Done" },
      ];
      const els = {
        board: document.getElementById("board"),
        add: document.getElementById("addTask"),
        dialog: document.getElementById("taskDialog"),
        form: document.getElementById("taskForm"),
        dialogTitle: document.getElementById("dialogTitle"),
        title: document.getElementById("taskTitle"),
        description: document.getElementById("taskDescription"),
        source: document.getElementById("taskSource"),
        priority: document.getElementById("taskPriority"),
        date: document.getElementById("taskDate"),
        status: document.getElementById("taskStatus"),
        close: document.getElementById("closeDialog"),
        cancel: document.getElementById("cancelDialog"),
        dayPicker: document.getElementById("dayPicker"),
        dayLabel: document.getElementById("dayLabel"),
        daySubtitle: document.getElementById("daySubtitle"),
        taskCount: document.getElementById("dayTaskCount"),
        doneCount: document.getElementById("dayDoneCount"),
      };
      let tasks = readArray(TASKS_KEY);
      let editingId = null;
      let selectedDate = localDateKey(new Date());
      let draggedTaskId = null;

      function readArray(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }
      function saveTasks() {

        els.taskCount.textContent = scoped.length;
        els.doneCount.textContent = scoped.filter((task) => task.status === "done").length;
        const rows = visibleTasks();
        els.body.replaceChildren();
        if (!rows.length) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.className = "table-empty";
          cell.colSpan = 6;
          const isSearching = !!searchTerm || activeFilter !== "all";
          cell.textContent = isSearching
            ? "No tasks match these filters. Try a different search or filter."
            : "No tasks for this view. Add a task or switch to All dates.";
          row.appendChild(cell);
          els.body.appendChild(row);
          return;
        }
        rows.forEach((task) => els.body.appendChild(renderRow(task)));
      }
      function buildSourceOptions(selected = "") {
        els.source.replaceChildren(new Option("No linked case or incident", ""));
        cases.forEach((item) => {
          const option = new Option(`Case · ${item.title || "Untitled"}${item.cc ? ` · ${item.cc}` : ""}`, `case:${item.id}`);
          option.dataset.type = "case";
          option.dataset.id = String(item.id);
          option.dataset.title = item.title || "Untitled";
          option.dataset.description = caseText(item).slice(0, 180);
          els.source.add(option);
        });
        incidents.forEach((item) => {
          const option = new Option(`Incident · ${item.category || "Other"} · ${item.title || "Untitled"}`, `incident:${item.id}`);
          option.dataset.type = "incident";
          option.dataset.id = String(item.id);
          option.dataset.title = item.title || "Untitled";
          option.dataset.description = String(item.description || "").slice(0, 180);
          els.source.add(option);
        });
        if (selected && !Array.from(els.source.options).some((option) => option.value === selected)) {
          els.source.add(new Option("Linked record no longer available", selected));
        }
        els.source.value = selected;
      }
      function openDialog(task = null) {
        editingId = task ? task.id : null;
        els.dialogTitle.textContent = task ? "Edit task" : "Add task";
        els.title.value = task ? task.title || "" : "";
        els.description.value = task ? task.description || "" : "";
        els.priority.value = task ? task.priority || "Normal" : "Normal";
        els.date.value = task ? task.date || today : (allDates ? today : selectedDate);
        els.status.value = task ? task.status || "todo" : "todo";
        buildSourceOptions(task && task.sourceType && task.sourceId ? `${task.sourceType}:${task.sourceId}` : "");
        if (typeof els.dialog.showModal === "function") els.dialog.showModal();
        else els.dialog.setAttribute("open", "");
        requestAnimationFrame(() => els.title.focus());
      }
      function closeDialog() {
        editingId = null;
        els.form.reset();
        if (typeof els.dialog.close === "function") els.dialog.close();
        else els.dialog.removeAttribute("open");
      }
      function updateTask(id, changes) {
        const next = tasks.map((task) => String(task.id) === String(id)
          ? { ...task, ...changes, updatedAt: new Date().toISOString() }
          : task);
        if (save(next)) render();
      }
      function deleteTask(id) {
        const task = tasks.find((item) => String(item.id) === String(id));
        if (!task) return;
        if (!confirm(`Delete “${task.title || "Untitled task"}”? The linked case or incident will remain.`)) return;
        const next = tasks.filter((item) => String(item.id) !== String(id));
        if (!save(next)) return;
        if (task.sourceType === "case" && task.sourceId != null && isDollarTask(task)) {
          const dismissed = new Set(readArray(DISMISSED_KEY).map(String));
          dismissed.add(String(task.sourceId));
          try { localStorage.setItem(DISMISSED_KEY, JSON.stringify([...dismissed])); }
          catch { console.warn("Could not save the deleted marked-case preference."); }
        }
        render();
        announce("Task deleted. The linked case is unchanged.");
      }
      function selectDay(date) {
        if (!date) return;
        selectedDate = date;
        allDates = false;
        render();
      }

      syncDollarCases();
      render();
      els.add.addEventListener("click", () => openDialog());
      document.getElementById("closeDialog").addEventListener("click", closeDialog);
      document.getElementById("cancelDialog").addEventListener("click", closeDialog);
      document.getElementById("previousDay").addEventListener("click", () => {
        const [year, month, day] = selectedDate.split("-").map(Number);
        const date = new Date(year, month - 1, day - 1);
        selectDay(localDateKey(date));
      });
      document.getElementById("nextDay").addEventListener("click", () => {
        const [year, month, day] = selectedDate.split("-").map(Number);
        const date = new Date(year, month - 1, day + 1);
        selectDay(localDateKey(date));
      });
      document.getElementById("todayButton").addEventListener("click", () => selectDay(today));
      els.allDates.addEventListener("click", () => { allDates = true; render(); });
      els.dayPicker.addEventListener("change", () => selectDay(els.dayPicker.value));
      els.search.addEventListener("input", () => {
        searchTerm = els.search.value;
        render();
      });
      document.querySelectorAll(".task-filter").forEach((button) => button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".task-filter").forEach((filter) =>
          filter.setAttribute("aria-pressed", String(filter === button)));
        render();
      }));
      els.form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = els.title.value.trim();
        if (!title || !els.date.value) return;
        const selected = els.source.selectedOptions[0];
        const sourceType = selected && selected.dataset.type ? selected.dataset.type : "";
        const sourceId = selected && selected.dataset.id ? selected.dataset.id : "";
        const sourceLabel = sourceType && selected.dataset.title
          ? `${sourceType === "case" ? "Case" : "Incident"} · ${selected.dataset.title}`
          : "";
        const now = new Date().toISOString();
        const fields = {
          title,
          description: els.description.value.trim(),
          priority: els.priority.value,
          date: els.date.value,
          status: els.status.value,
          sourceType,
          sourceId,
          sourceLabel,
          updatedAt: now,
        };
        let next;
        if (editingId) {
          next = tasks.map((task) => {
            if (String(task.id) !== String(editingId)) return task;
            const updated = { ...task, ...fields };
            const linkedCase = sourceType === "case" ? caseFor(sourceId) : null;
            if (task.autoGenerated === AUTO_MARKER && linkedCase && isDollarCase(linkedCase)) {
              updated.autoGenerated = AUTO_MARKER;
            } else {
              delete updated.autoGenerated;
            }
            return updated;
          });
        } else {
          next = [{ id: makeId(), ...fields, createdAt: now }, ...tasks];
        }
        if (save(next)) {
          selectedDate = els.date.value;
          allDates = false;
          closeDialog();
          render();
          announce(wasEditing ? "Task updated." : "Task added.");
        }
      });
      els.source.addEventListener("change", () => {
        const option = els.source.selectedOptions[0];
        if (!option) return;
        if (!els.title.value.trim() && option.dataset.title) els.title.value = `Follow up: ${option.dataset.title}`;
        if (!els.description.value.trim() && option.dataset.description) els.description.value = option.dataset.description;
      });
      els.dialog.addEventListener("click", (event) => {
        if (event.target === els.dialog) closeDialog();
      });
      window.addEventListener("storage", (event) => {
        if (![TASKS_KEY, CASES_KEY, INCIDENTS_KEY, DISMISSED_KEY].includes(event.key)) return;
        tasks = readArray(TASKS_KEY);
        cases = readArray(CASES_KEY);
        incidents = readArray(INCIDENTS_KEY);
        syncDollarCases();
        render();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) return;
        tasks = readArray(TASKS_KEY);
        cases = readArray(CASES_KEY);
        incidents = readArray(INCIDENTS_KEY);
        syncDollarCases();
        render();
      });
    })();
  </script>
</body>
</html>
